# DRAFT: freeze and tag `protocol-frozen` in week 6. You decide the freeze; see ROADMAP section 8.
# Revised 2026-11-23: volatility and risk are the headline targets (ADR 0002); price forecasts are secondary.
targets: {primary: brent, robustness: wti}
daily:   {horizons: [1, 5, 10, 22, 66], unit: trading_days}
monthly: {horizons: [1, 3, 6, 12, 24], unit: months}
volatility:                       # headline task
  target: forward_realized_vol    # sqrt(252 * mean squared daily log return over t+1..t+h), annualised
  horizons: [5, 22, 66]
  unit: trading_days
  anchor: har_ovx                 # deep and AR-MoE models predict a shrunk residual on this
  benchmarks: [naive_rv, ewma, garch_t, gjr_garch_t, har, ovx, har_ovx]
  losses: [qlike, mse_logvol, mse_var]    # qlike is primary
risk:
  var_levels: [0.01, 0.05]
  horizons: [1, 10]
  backtests: [kupiec, christoffersen, es_test, fz0]
design:
  scheme: expanding_window_rolling_origin
  train_start: 1987-05-20
  test_start: 2010-01-01          # price-only models
  ovx_test_start: 2012-01-01      # anything using OVX (starts 2007-05)
  text_modes_test_start: 2015-01-01
  gap: horizon                    # training origins end h + 1 rows before the first test origin: every training target is realised before it
  refit: {deep: yearly, statistical: monthly}
  seeds: 5
clean_holdout_start: 2025-07-01   # TSFM contamination control; for volatility also keep the last 12 months untouched
metrics: [mspe_ratio, mae_ratio, mase, success_ratio, crps, pinball, coverage, winkler, qlike, mse_logvol]
tests: [dm_hln, clark_west, giacomini_white, mcs, multi_horizon_spa, giacomini_rossi, pesaran_timmermann]
