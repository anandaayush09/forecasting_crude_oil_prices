# Continuous integration: runs on every push to main and on every pull request.
# A failing step turns the run red. Once the repo is on GitHub you can make this check required
# for merging (Settings -> Branches -> branch protection).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# If a new commit is pushed while an older run is still going, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # 1. Get the code.
      - uses: actions/checkout@v4

      # 2. Install Python 3.12 and cache pip downloads between runs (keyed on the requirements files).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 3. Install dependencies. Installing on a clean Linux machine also proves the pins resolve there.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # 4. Lint: real errors, import order, bug-prone patterns.
      - name: Lint
        run: ruff check .

      # 5. Format check: fails if `ruff format` would change anything (it never rewrites files in CI).
      - name: Format check
        run: ruff format --check .

      # 6. Tests, including the leakage suite. No network or paid API calls are allowed in tests.
      - name: Tests
        run: pytest -q
